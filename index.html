<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital SAT Practice Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for rendering math formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-indigo-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Digital SAT Practice Hub</h1>
      <span id="api-status" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full border border-indigo-400">Loading API...</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 my-6">

    <!-- Filters Section -->
    <div class="bg-white p-4 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Section</label>
        <select id="section-filter" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="all">All Sections</option>
          <option value="math">Math</option>
          <option value="english">Reading & Writing</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Difficulty</label>
        <select id="difficulty-filter" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="all">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>

      <div class="flex items-end">
        <button id="apply-filters-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded transition text-sm">
          Fetch / Refresh Questions
        </button>
      </div>
    </div>

    <!-- Question Display Container -->
    <div id="question-card" class="bg-white p-6 rounded-lg shadow-md hidden">
      <!-- Question Header / Badges -->
      <div class="flex justify-between items-center mb-4">
        <span id="q-section" class="text-xs font-bold uppercase tracking-wider px-2 py-1 bg-indigo-100 text-indigo-700 rounded"></span>
        <span id="q-difficulty" class="text-xs font-semibold px-2 py-1 bg-gray-100 text-gray-700 rounded"></span>
      </div>

      <!-- Question Text -->
      <div id="q-prompt" class="text-gray-900 text-lg mb-6 leading-relaxed"></div>

      <!-- Options List -->
      <div id="q-options" class="space-y-3 mb-6"></div>

      <!-- Explanation Container (Hidden until answer selected) -->
      <div id="explanation-box" class="mt-6 p-4 rounded bg-gray-50 border border-gray-200 hidden">
        <h4 class="font-bold text-gray-800 mb-1">Explanation:</h4>
        <p id="q-explanation" class="text-sm text-gray-700 leading-relaxed"></p>
      </div>

      <!-- Action Buttons -->
      <div class="mt-6 flex justify-between items-center pt-4 border-t border-gray-100">
        <button id="prev-btn" class="px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50">Previous</button>
        <span id="q-counter" class="text-sm text-gray-500">Question 1 of 1</span>
        <button id="next-btn" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm hover:bg-indigo-700 disabled:opacity-50">Next</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading-spinner" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="mt-2 text-sm text-gray-500">Fetching practice questions...</p>
    </div>

  </main>

  <script>
    // --- Direct Endpoint Setup ---
    const API_ENDPOINT = 'https://pinesat.duckdns.org/api/questions';

    // Local fallback questions in case third-party API is offline or restricted
    const FALLBACK_QUESTIONS = [
      {
        id: 1,
        section: "math",
        difficulty: "Hard",
        prompt: "If f(x) = 3x^2 - 12x + 7, what is the minimum value of f(x)?",
        options: ["-5", "-2", "2", "7"],
        correct: 0,
        explanation: "The vertex x-coordinate of f(x) is x = -b/(2a) = 12/6 = 2. Substituting x = 2 yields f(2) = 3(4) - 24 + 7 = -5."
      },
      {
        id: 2,
        section: "english",
        difficulty: "Medium",
        prompt: "The researcher's analysis was ______, covering nearly every variable involved in the ecological shift.",
        options: ["exhaustive", "superficial", "preliminary", "cursory"],
        correct: 0,
        explanation: "'Exhaustive' means comprehensive and thorough, perfectly matching the context of covering nearly every variable."
      }
    ];

    let questions = [];
    let currentIndex = 0;

    // DOM Elements
    const qCard = document.getElementById('question-card');
    const loadingSpinner = document.getElementById('loading-spinner');
    const apiStatus = document.getElementById('api-status');
    const sectionFilter = document.getElementById('section-filter');
    const difficultyFilter = document.getElementById('difficulty-filter');
    const applyFiltersBtn = document.getElementById('apply-filters-btn');

    // Fetch Questions from Endpoint
    async function loadQuestionsFromEndpoint() {
      showLoading(true);
      
      const selectedSection = sectionFilter.value;
      const selectedDifficulty = difficultyFilter.value;

      // Construct endpoint URL with parameters
      let url = API_ENDPOINT;
      const params = new URLSearchParams();
      
      if (selectedSection !== 'all') {
        params.append('section', selectedSection);
      }
      if (selectedDifficulty !== 'all') {
        params.append('difficulty', selectedDifficulty);
      }

      if ([...params].length > 0) {
        url += '?' + params.toString();
      }

      try {
        const response = await fetch(url, { method: 'GET' });
        
        if (!response.ok) throw new Error('API Response Error');

        const data = await response.json();
        
        // Normalize response data structure
        if (Array.isArray(data) && data.length > 0) {
          questions = normalizeQuestions(data);
          apiStatus.textContent = "Connected to Direct Endpoint";
          apiStatus.className = "text-xs bg-green-800 text-green-100 px-2.5 py-1 rounded-full";
        } else {
          throw new Error('No data returned from API');
        }

      } catch (error) {
        console.warn("Direct Endpoint failed, using fallback database:", error);
        questions = FALLBACK_QUESTIONS;
        apiStatus.textContent = "Offline / Fallback Data";
        apiStatus.className = "text-xs bg-amber-800 text-amber-100 px-2.5 py-1 rounded-full";
      }

      showLoading(false);
      currentIndex = 0;
      renderCurrentQuestion();
    }

    // Helper to format/normalize external API structures
    function normalizeQuestions(rawList) {
      return rawList.map((item, idx) => ({
        id: item.id || idx + 1,
        section: item.section || "General",
        difficulty: item.difficulty || "Medium",
        prompt: item.question ? (item.question.paragraph || item.question.prompt || item.prompt) : (item.prompt || "Question prompt unavailable."),
        options: item.options || item.choices || ["Option A", "Option B", "Option C", "Option D"],
        correct: item.correct !== undefined ? item.correct : 0,
        explanation: item.explanation || "No explanation provided for this question."
      }));
    }

    // Render Current Question to Screen
    function renderCurrentQuestion() {
      if (!questions || questions.length === 0) {
        qCard.innerHTML = `<p class="text-center text-gray-500 py-8">No questions found for the selected filters.</p>`;
        qCard.classList.remove('hidden');
        return;
      }

      const q = questions[currentIndex];

      document.getElementById('q-section').textContent = q.section;
      document.getElementById('q-difficulty').textContent = q.difficulty;
      document.getElementById('q-prompt').innerHTML = q.prompt;
      document.getElementById('q-explanation').innerHTML = q.explanation;

      // Hide explanation until user selects an answer
      const expBox = document.getElementById('explanation-box');
      expBox.classList.add('hidden');

      // Render Options
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center justify-between";
        btn.innerHTML = `<span class="font-semibold mr-3">${String.fromCharCode(65 + index)}.</span> <span>${opt}</span>`;
        
        btn.onclick = () => handleOptionClick(index, q.correct, btn);
        optionsContainer.appendChild(btn);
      });

      // Update Navigation
      document.getElementById('q-counter').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;

      qCard.classList.remove('hidden');
    }

    // Handle Option Selection
    function handleOptionClick(selectedIndex, correctIndex, buttonEl) {
      const allButtons = document.getElementById('q-options').children;

      // Disable further clicks on current question
      Array.from(allButtons).forEach((b, idx) => {
        b.disabled = true;
        if (idx === correctIndex) {
          b.className = "w-full text-left p-3 rounded border border-green-500 bg-green-50 text-green-900 font-medium flex items-center justify-between";
        }
      });

      if (selectedIndex !== correctIndex) {
        buttonEl.className = "w-full text-left p-3 rounded border border-red-500 bg-red-50 text-red-900 font-medium flex items-center justify-between";
      }

      // Show explanation
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function showLoading(isLoading) {
      if (isLoading) {
        loadingSpinner.classList.remove('hidden');
        qCard.classList.add('hidden');
      } else {
        loadingSpinner.classList.add('hidden');
      }
    }

    // Event Listeners
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentQuestion();
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
      }
    });

    applyFiltersBtn.addEventListener('click', loadQuestionsFromEndpoint);

    // Initial Load
    window.addEventListener('DOMContentLoaded', loadQuestionsFromEndpoint);
  </script>
</body>
</html>
