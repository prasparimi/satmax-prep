<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Question Selector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 max-w-md w-full space-y-6">
    <h2 class="text-xl font-bold text-slate-800">SAT Practice Setup</h2>

    <!-- Option 1: Segmented Button Selector -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Select Question Count
      </label>
      <div class="grid grid-cols-4 gap-2" id="button-group">
        <button 
          type="button" 
          data-value="10" 
          class="count-btn py-2 px-3 text-sm font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 transition-colors">
          10
        </button>
        <button 
          type="button" 
          data-value="20" 
          class="count-btn py-2 px-3 text-sm font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 transition-colors">
          20
        </button>
        <button 
          type="button" 
          data-value="30" 
          class="count-btn py-2 px-3 text-sm font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 transition-colors">
          30
        </button>
        <button 
          type="button" 
          data-value="54" 
          class="count-btn py-2 px-3 text-sm font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition-colors">
          54 <span class="text-[10px] block font-normal">(Full)</span>
        </button>
      </div>
    </div>

    <!-- Option 2: Standard HTML Dropdown Alternative -->
    <div>
      <label for="question-select" class="block text-sm font-semibold text-slate-700 mb-2">
        Or Choose via Dropdown
      </label>
      <select 
        id="question-select" 
        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <option value="10">10 Questions (Quick Practice)</option>
        <option value="20">20 Questions (Standard Quiz)</option>
        <option value="30">30 Questions (Extended Practice)</option>
        <option value="54" selected>54 Questions (Full Reading & Writing Section)</option>
      </select>
    </div>

    <!-- Output Display -->
    <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-sm">
      <span class="text-slate-500">Selected Count:</span>
      <span id="selected-display" class="font-bold text-indigo-600 text-base">54 questions</span>
    </div>
  </div>

  <script>
    let selectedCount = 54;

    const buttons = document.querySelectorAll('.count-btn');
    const selectDropdown = document.getElementById('question-select');
    const display = document.getElementById('selected-display');

    function updateSelection(value) {
      selectedCount = Number(value);
      display.textContent = `${selectedCount} questions`;

      // Sync Dropdown
      selectDropdown.value = selectedCount;

      // Sync Button Styles
      buttons.forEach(btn => {
        const btnValue = Number(btn.getAttribute('data-value'));
        if (btnValue === selectedCount) {
          btn.className = 'count-btn py-2 px-3 text-sm font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition-colors';
        } else {
          btn.className = 'count-btn py-2 px-3 text-sm font-medium rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 transition-colors';
        }
      });
    }

    // Event Listeners
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        updateSelection(btn.getAttribute('data-value'));
      });
    });

    selectDropdown.addEventListener('change', (e) => {
      updateSelection(e.target.value);
    });
  </script>

</body>
</html>
